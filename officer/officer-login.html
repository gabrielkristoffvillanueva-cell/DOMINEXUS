<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Officer Login | DOMINEXUS</title>

    <link rel="stylesheet" href="officer-login.css">
</head>


<body>

    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <main class="login-page">

        <div class="login-container">

            <!-- LEFT SIDE -->
            <section class="login-brand">

                <div class="brand-logo">
                    D
                </div>

                <h1>DOMINEXUS</h1>

                <p class="brand-subtitle">
                    Student Organization Attendance
                    Management System
                </p>

                <div class="brand-line"></div>

                <p class="access-label">
                    OFFICER ACCESS
                </p>

                <p class="brand-description">
                    Manage organization meetings, attendance,
                    members, and student requests in one place.
                </p>

            </section>


            <!-- RIGHT SIDE -->
            <section class="login-card">

                <div class="login-header">

                    <span class="login-label">
                        OFFICER PORTAL
                    </span>

                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to access your officer account.
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="officerLoginForm">

                    <!-- OFFICER ID -->

                    <div class="form-group">

                        <label for="officerId">
                            Officer ID
                        </label>

                        <input type="text" id="officerId" name="officerId" placeholder="Enter your Officer ID"
                            autocomplete="username" required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <div class="password-label-row">

                            <label for="officerPassword">
                                Password
                            </label>

                            <a href="#" id="forgotPassword">
                                Forgot Password?
                            </a>

                        </div>


                        <div class="password-wrapper">

                            <input type="password" id="officerPassword" name="officerPassword"
                                placeholder="Enter your password" autocomplete="current-password" required>

                            <button type="button" id="togglePassword" class="toggle-password"
                                aria-label="Show password">
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- REMEMBER ID -->

                    <div class="remember-row">

                        <label class="remember-label">

                            <input type="checkbox" id="rememberOfficer">

                            <span>
                                Remember my Officer ID
                            </span>

                        </label>

                    </div>


                    <!-- ERROR MESSAGE -->

                    <div id="loginMessage" class="login-message" aria-live="polite"></div>


                    <!-- LOGIN BUTTON -->

                    <button type="submit" class="login-button">
                        Login
                    </button>

                </form>


                <!-- BACK -->

                <a href="../index.html" class="back-home">
                    ← Back to Home
                </a>

            </section>

        </div>

    </main>


    <script src="officer-login.js"></script>

</body>

</html>
